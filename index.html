<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101322"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="LIFE OS"><title>ARC / 自分を育てる48日</title><style>
:root{--bg:#0b1020;--panel:#161c30;--panel2:#1d263c;--muted:#a7b2c9;--txt:#f5f7ff;--lime:#c5ff8b;--purple:#9f92ff;--pink:#ffa6ca;--line:#33405b}*{box-sizing:border-box}body{margin:0;color:var(--txt);background:radial-gradient(ellipse at 92% 0%,#322c54 0,transparent 43%),radial-gradient(ellipse at -12% 22%,#183747 0,transparent 39%),var(--bg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;min-height:100vh}.app{max-width:560px;margin:auto;padding:24px 17px 105px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:13px;font-weight:900;letter-spacing:3.6px;color:var(--lime)}.small{color:var(--muted);font-size:12px}.date{font-size:12px;color:var(--muted)}h1{font-size:30px;line-height:1.28;letter-spacing:-1px;margin:18px 0 10px}h2{font-size:19px;line-height:1.4;margin:0}h3{margin:0;font-size:15px}.lead{color:#cbd4e8;margin:0 0 20px}.hero{border:1px solid #3a4c63;background:linear-gradient(125deg,#27394b 0%,#2b2543 60%,#24253b 100%);border-radius:25px;padding:22px;margin:19px 0;box-shadow:0 15px 55px #0004}.eyebrow{font-size:11px;color:var(--lime);font-weight:800;letter-spacing:2px}.hero strong{display:block;font-size:25px;letter-spacing:-.5px;margin:9px 0}.hero p{color:#d4d9ec;margin:0 0 16px}.progress{height:10px;border-radius:20px;background:#0c1827;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--lime),#83efd5);border-radius:20px;transition:width .2s}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 5px}.stat{background:#131d31aa;border:1px solid #36445c;border-radius:14px;padding:12px 8px;text-align:center}.stat b{font-size:20px;display:block}.stat span{font-size:10px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(140deg,#18223a,#161b2e);padding:18px;margin:14px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:13px}.pill{font-size:11px;padding:5px 10px;border-radius:100px;background:#293a3f;color:var(--lime);font-weight:700}.muted{color:var(--muted)}.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #2d3850;cursor:pointer}.task:first-of-type{border-top:0}.task input{appearance:none;flex:none;width:22px;height:22px;border:1.5px solid #7889a8;border-radius:8px;margin:0;background:#11192a}.task input:checked{background:var(--lime);border-color:var(--lime)}.task input:checked:after{content:'✓';display:block;color:#101720;font-weight:900;text-align:center;line-height:19px}.task .name{font-weight:650}.task .meta{color:var(--muted);font-size:11px}.task.done .name{text-decoration:line-through;color:#8d9bb1}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#11172af2;border-top:1px solid #33405b;backdrop-filter:blur(16px);padding:9px max(9px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));z-index:5}.navwrap{display:flex;max-width:560px;width:100%;justify-content:space-around}.tab{background:transparent;color:#aab5c9;border:none;min-width:60px;padding:7px 4px;border-radius:12px;font:inherit;font-size:10px;cursor:pointer}.tab span{display:block;font-size:19px}.tab.active{background:#2d344d;color:var(--lime)}.button{background:var(--lime);color:#192323;border:0;border-radius:13px;font-weight:850;font-size:13px;padding:11px 15px;cursor:pointer}.secondary{background:#2b3650;color:white}.ghost{background:none;border:1px solid #5a6881;color:#e9edff}.danger{background:#5a2735;color:#ffd7e2}.button:active{transform:scale(.98)}.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:#202940;border:1px solid transparent;border-radius:12px;text-align:center;padding:9px 2px;color:white;cursor:pointer}.day.active{border-color:var(--lime);color:var(--lime);background:#354340}.day b{display:block;font-size:14px}.day span{font-size:10px}.item{padding:13px 0;border-bottom:1px solid #303b53}.item:last-child{border-bottom:0}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:start}.itemtime{font-size:11px;color:var(--lime);font-weight:750}.itemtitle{font-weight:750}.tag{border-radius:50px;background:#29314b;padding:3px 8px;font-size:10px;color:#cbd5ed}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{background:#0f1729;border:1px solid #48546c;color:white;padding:12px 13px;border-radius:11px;width:100%;font:inherit;outline:none;min-width:0}.field:focus{border-color:var(--lime)}textarea.field{min-height:120px;resize:vertical}.label{display:block;color:#bfcbe0;font-size:12px;font-weight:750;margin:11px 0 6px}.quote{border-left:3px solid var(--purple);padding-left:13px;color:#dde2f3;margin:15px 0;font-size:13px}.phase{padding:14px 0;border-top:1px solid #384157}.phase b{display:block}.phase small{color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;z-index:10;bottom:95px;left:50%;transform:translateX(-50%);background:#daf9bb;color:#122223;padding:10px 17px;border-radius:30px;font-weight:800;white-space:nowrap;box-shadow:0 10px 45px #0007;display:none}.tip{font-size:12px;color:#b9c3d9}.flame{color:#ffcb89}.navtitle{display:flex;align-items:center;justify-content:space-between;margin:21px 0 11px}.datecontrol{display:flex;align-items:center;gap:6px}.datecontrol button{border:1px solid #475471;background:#202a41;color:#fff;border-radius:10px;padding:7px 12px}.datecontrol input{color-scheme:dark;width:135px;font-size:12px}.kicker{color:var(--pink);font-weight:800;font-size:12px}.score{font-size:36px;line-height:1.2;color:var(--lime);font-weight:900}.footer{font-size:11px;color:#9eabc3;text-align:center;margin:22px 0}.remove{background:none;border:none;color:#e8b4bf;cursor:pointer;padding:2px 5px}.checkbadge{padding:2px 9px;border-radius:30px;background:#304a3a;color:var(--lime);font-size:11px}.empty{color:var(--muted);font-size:13px;padding:12px 0}@media(min-width:600px){.app{padding-top:32px}} 
</style></head><body><main class="app"><div class="top"><div class="logo">✦ ARC / LIFE OS</div><div class="date" id="headerDate"></div></div><section id="home"></section><section id="week" class="hidden"></section><section id="journal" class="hidden"></section><section id="vision" class="hidden"></section><section id="settings" class="hidden"></section><div class="footer">昨日の自分を責めず、今日の行動で信頼を育てる。<br>データはこのブラウザ内に保存されます。</div></main><nav class="tabs"><div class="navwrap"><button class="tab active" data-tab="home"><span>✦</span>今日</button><button class="tab" data-tab="week"><span>▦</span>週間</button><button class="tab" data-tab="journal"><span>♡</span>記録</button><button class="tab" data-tab="vision"><span>◈</span>目標</button><button class="tab" data-tab="settings"><span>⚙</span>設定</button></div></nav><div id="toast" class="toast"></div><input type="file" id="importFile" accept=".json,application/json" class="hidden"><script>
const KEY='arc_life_os_v1';const tz='Asia/Tokyo';const iso=(d)=>{const a=new Intl.DateTimeFormat('sv-SE',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);return a};const today=()=>iso(new Date());const dayDate=x=>new Date(x+'T12:00:00+09:00');const add=(date,n)=>iso(new Date(dayDate(date).getTime()+n*864e5));const dow=['日','月','火','水','木','金','土'];const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const HABITS=[{id:'sense',label:'五感・瞑想',min:'3分',max:'15分',emoji:'🌿'},{id:'learn',label:'心理学 / NLP / マーケ学習',min:'5分',max:'20分',emoji:'🧠'},{id:'create',label:'事業につながる小さな発信',min:'3分',max:'20分',emoji:'🚀'},{id:'reflect',label:'自己受容・振り返り',min:'3分',max:'10分',emoji:'♡'}];const TEMPLATE={0:[['20:00','20分','翌週の作戦会議','内面']],1:[['朝','3分','五感を感じる','内面'],['夜','10分','ダーリン練習（12/5まで）','音楽']],2:[['朝','3分','五感を感じる','内面'],['夜','60〜75分','筋トレ','身体']],3:[['夜','20分','事業：発信下書き','事業'],['夜','10分','ダーリン練習（12/5まで）','音楽']],4:[['夜','60〜75分','筋トレ','身体']],5:[['夜','15分','1週間の記録を振り返る','内面'],['夜','10分','ダーリン練習（12/5まで）','音楽']],6:[['午前 or 空き時間','45分','心理学・マーケ深掘りと発信','事業'],['午後 or 空き時間','60〜75分','筋トレ（調整可）','身体']]};const blank=()=>({habits:{},journal:{},plans:{},weekOverrides:{},focus:'',miniMode:true});let s;try{s={...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s=blank()};let active='home',viewDate=today(),weekDate=today();const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const notify=m=>{const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.style.display='none',2200)};const done=(day,id)=>!!s.habits[day]?.[id];const count=day=>HABITS.filter(h=>done(day,h.id)).length;const daysLeft=()=>Math.max(0,Math.ceil((dayDate('2027-01-01')-dayDate(today()))/864e5));const isPast=day=>day<=today();const total=()=>{let n=0;Object.entries(s.habits).forEach(([day,hs])=>{if(isPast(day))n+=HABITS.filter(h=>hs[h.id]).length});return n};const streak=()=>{let d=today(),n=0;if(count(d)===0)d=add(d,-1);for(let i=0;i<365;i++){if(count(d)===0)break;n++;d=add(d,-1)}return n};const level=()=>Math.floor(total()/20)+1;const fmt=day=>`${Number(day.slice(5,7))}/${Number(day.slice(8,10))} (${dow[dayDate(day).getDay()]})`;const dayPlan=day=>{let wd=dayDate(day).getDay();let defaults=(TEMPLATE[wd]||[]).map((a,i)=>({id:'base'+i,time:a[0],duration:a[1],title:a[2],category:a[3]}));if(day>'2026-12-05')defaults=defaults.filter(x=>!x.title.includes('ダーリン'));if(day==='2026-11-15')defaults=[{id:'beppu',time:'午後中心',duration:'遠征',title:'マッスルゲート別府を観戦（移動・回復優先）',category:'特別'}];if(day==='2026-12-05')defaults=[{id:'live',time:'本番',duration:'ライブ',title:'「ダーリン」ライブ出演。体調を整える',category:'特別'}];return [...defaults,...(s.plans[day]||[])].filter(x=>!(s.weekOverrides[day]||[]).includes(x.id))};function taskMarkup(day){return HABITS.map(h=>`<label class="task ${done(day,h.id)?'done':''}"><input type="checkbox" data-habit="${h.id}" data-day="${day}" ${done(day,h.id)?'checked':''}><div style="flex:1"><div class="name">${h.emoji} ${h.label}</div><div class="meta">${s.miniMode?'最低 '+h.min:'理想 '+h.max} · できたらチェック</div></div></label>`).join('')}function paint(){document.getElementById('headerDate').textContent=fmt(today());document.querySelectorAll('main section').forEach(e=>e.classList.add('hidden'));document.getElementById(active).classList.remove('hidden');document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.tab===active));document.getElementById(active).innerHTML=({home:homeHTML,week:weekHTML,journal:journalHTML,vision:visionHTML,settings:settingsHTML})[active]();}
function homeHTML(){let n=count(viewDate),pct=Math.round(100*n/4),d=daysLeft();return `<h1>理想の自分は、<br><span style="color:var(--lime)">今日の一歩</span>から。</h1><p class="lead">強くなるために、自分を責めない。<br>小さな行動で、自己信頼を育てよう。</p><div class="hero"><span class="eyebrow">WINTER ARC · 2026</span><strong>年末まであと ${d} 日</strong><p>自分の価値を証明する48日ではなく、<br>誠実に生きる自分を育てる期間。</p><div class="progress"><div class="fill" style="width:${Math.max(0,Math.min(100,Math.round((48-d)/48*100)))}%"></div></div><div class="statrow"><div class="stat"><b>${total()*10}</b><span>積み上げ XP</span></div><div class="stat"><b>${streak()}日</b><span>継続日数</span></div><div class="stat"><b>Lv.${level()}</b><span>自己信頼レベル</span></div></div></div><div class="card"><div class="head"><h2>今日の小さな約束</h2><span class="pill">${n}/4 完了</span></div><div class="datecontrol"><button data-shift="-1">‹</button><input type="date" id="viewDate" class="field" value="${viewDate}"><button data-shift="1">›</button><button class="button secondary" data-today="1">今日</button></div><div style="height:13px"></div><div class="progress"><div class="fill" style="width:${pct}%"></div></div>${taskMarkup(viewDate)}<div class="actionrow"><button class="button secondary" data-mini="1">${s.miniMode?'理想ラインを見る':'最低ラインに戻す'}</button><button class="button ghost" data-go="journal">気づきを残す →</button></div></div><div class="card"><div class="head"><h2>自分との約束</h2><span class="kicker">MY IDENTITY</span></div><div class="quote">私は過去の行動に責任を持つ。<br>他人を尊重し、自分にも誠実でいる。<br>完璧でなくても、今日の行動を選べる。</div><div class="tip">できなかった日も「失敗」ではない。次の日に最低ラインから再開。</div></div><div class="card"><div class="head"><h2>今日の重要な一件</h2><span class="pill">FOCUS</span></div><input id="focus" class="field" placeholder="例：自己肯定感について3行書く" value="${esc(s.focus)}"><div class="actionrow"><button class="button" data-savefocus="1">この一件に決める</button></div></div>`}
function weekHTML(){const dowIdx=dayDate(weekDate).getDay(),monday=add(weekDate,-(dowIdx+6)%7),days=Array.from({length:7},(_,i)=>add(monday,i));return `<h1>週間リズムをつくる。</h1><p class="lead">予定は固定しすぎない。70%の余白を残し、調整できる週へ。</p><div class="card"><div class="head"><h2>今週の予定</h2><div class="datecontrol"><button data-weekshift="-7">‹</button><button data-weekshift="7">›</button></div></div><div class="days">${days.map(d=>`<button class="day ${d===weekDate?'active':''}" data-weekday="${d}"><span>${dow[dayDate(d).getDay()]}</span><b>${+d.slice(8)}</b><span>${count(d)?count(d)+'/4':'·'}</span></button>`).join('')}</div><div style="margin-top:17px"><span class="eyebrow">${fmt(weekDate)} · PLAN</span>${dayPlan(weekDate).map(p=>`<div class="item"><div class="itemtop"><div><div class="itemtime">${esc(p.time)}　·　${esc(p.duration)}</div><div class="itemtitle">${esc(p.title)}</div></div><div style="display:flex;align-items:center;gap:5px"><span class="tag">${esc(p.category)}</span><button class="remove" title="この日から外す" data-delplan="${esc(p.id)}">×</button></div></div></div>`).join('')||'<div class="empty">予定はまだありません。余白も大切な計画です。</div>'}</div></div><div class="card"><h2>この日の予定を追加</h2><label class="label">やること</label><input class="field" id="planTitle" placeholder="例：学びを音声で3分アウトプット"><div class="grid2"><div><label class="label">時間帯</label><input class="field" id="planTime" placeholder="夜 / 20:00"></div><div><label class="label">所要時間</label><input class="field" id="planDuration" placeholder="20分"></div></div><div class="actionrow"><button class="button" data-addplan="1">予定を追加</button></div><div class="tip" style="margin-top:11px">所要時間は自分の予想の1.5倍を見積もる。終わりの条件も決めよう。</div></div><div class="card"><h2>週間設計ルール</h2><div class="item">平日：帰宅が遅い日は最低14分のみでOK</div><div class="item">筋トレ：週2回を必須、3回目は余裕がある週</div><div class="item">発信：週1件「公開または人に届ける」を目標</div><div class="item">週末：事業45分＋日曜のレビュー20分</div><div class="item">ボイトレ：12/5までは10分×週3〜5回を目標</div></div>`}
function journalHTML(){const j=s.journal[viewDate]||{};return `<h1>その日の自分を、<br>ちゃんと見てあげる。</h1><p class="lead">感情を無理にポジティブにしない。事実と心の声を別々に残そう。</p><div class="card"><div class="head"><h2>今日のジャーナル</h2><span class="pill">${fmt(viewDate)}</span></div><input type="date" class="field" id="journalDate" value="${viewDate}"><label class="label">今日あった事実</label><textarea class="field" id="jfact" placeholder="何が起きた？ できたこと・できなかったことも事実だけで">${esc(j.fact)}</textarea><label class="label">自分で感じたこと（書きたいときだけ）</label><textarea class="field" id="jfeeling" placeholder="本当は何を感じた？ まだ分からなければ空欄でOK">${esc(j.feeling)}</textarea><label class="label">誠実に選んだ小さな行動</label><textarea class="field" id="jhonest" placeholder="例：見栄を張らずに素直に話せた">${esc(j.honest)}</textarea><label class="label">明日の最小の一歩</label><input class="field" id="jnext" placeholder="例：起床後に3分瞑想" value="${esc(j.next)}"><div class="actionrow"><button class="button" data-savejournal="1">この日の記録を保存</button></div></div><div class="card"><h2>自己受容のヒント</h2><div class="quote">行動は改善できる。<br>でも、できなかった日を理由に自分の存在を否定しなくていい。</div><div class="tip">日記には、あなたが言っていない気持ちや結論を自動追加しません。</div></div>`}
function visionHTML(){return `<h1>目指す未来を、<br>毎日の選択につなぐ。</h1><p class="lead">ゴールは完璧な人間になることではなく、誠実さと実行力を育てること。</p><div class="card"><span class="eyebrow">NORTH STAR · 2027/12/31</span><h2 style="margin:8px 0">自分のコーチング事業で独立</h2><p class="muted">発信 → 体験セッション → 有料顧客 → 継続収益。2026年末は発信と提供価値の検証に集中。</p></div><div class="card"><h2>年末までの3つの柱</h2><div class="phase"><b>🌿 1. 内面・人格・自己信頼</b><small>毎日：五感3分 / 夜に自分を責めず振り返る / 誠実な行動</small></div><div class="phase"><b>🚀 2. 学び・発信・事業</b><small>毎日：5〜20分学習 / 週1本の発信 / 月内に体験セッションを検討</small></div><div class="phase"><b>💪 3. 身体・規律</b><small>週2〜3回トレーニング / タンパク質と睡眠を優先 / 16%を長期目標に</small></div></div><div class="card"><h2>48日のロードマップ</h2><div class="phase"><span class="pill">11/14〜11/22</span><b>第1期｜生活の土台をつくる</b><small>開始儀式・習慣・学習の固定化。できた日を記録</small></div><div class="phase"><span class="pill">11/23〜12/5</span><b>第2期｜小さく公開する</b><small>発信を形にする。12/5ライブの準備も優先</small></div><div class="phase"><span class="pill">12/6〜12/20</span><b>第3期｜人に価値を届ける</b><small>学びを説明し、体験セッションなどの反応を検証</small></div><div class="phase"><span class="pill">12/21〜12/31</span><b>第4期｜2027年を設計</b><small>行動実績を確認し、次の90日を決める</small></div></div><div class="card"><h2>年末の到達イメージ</h2><div class="quote">「もう何もかも変わった」ではなく、<br>「未完成でも、自分の味方でいられる。<br>そして、行動を始められている」</div></div>`}
function settingsHTML(){return `<h1>自分に合う道具に、<br>育てていこう。</h1><p class="lead">予定や記録はこの端末のブラウザに保存。定期的にバックアップしてね。</p><div class="card"><h2>データの管理</h2><p class="tip">別の端末やブラウザには自動同期されません。バックアップをダウンロードして移行できます。</p><div class="actionrow"><button class="button" data-export="1">記録をバックアップ</button><button class="button secondary" data-import="1">バックアップを復元</button></div></div><div class="card"><h2>リセット</h2><p class="tip">間違えてリセットしないよう、実行時に確認します。</p><button class="button danger" data-reset="1">全記録を初期化</button></div><div class="card"><h2>使い方</h2><div class="item">① 今日：最低14分の習慣をチェック</div><div class="item">② 週間：曜日別の予定を編集</div><div class="item">③ 記録：自分の言葉で事実と気持ちを書く</div><div class="item">④ 目標：年末までの方向を見失わない</div><div class="item">⑤ 設定：JSONでバックアップ</div></div><div class="tip">このアプリはローカル動作版です。通知・Notion・Googleカレンダーとの同期は未実装です。</div>`}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.tab){active=el.dataset.tab;paint();scrollTo(0,0)}else if(el.dataset.go){active=el.dataset.go;paint();scrollTo(0,0)}else if(el.dataset.shift){viewDate=add(viewDate,Number(el.dataset.shift));paint()}else if(el.dataset.today){viewDate=today();paint()}else if(el.dataset.mini){s.miniMode=!s.miniMode;save();paint()}else if(el.dataset.savefocus){s.focus=document.getElementById('focus').value;save();notify('今日の一件を保存したよ')}else if(el.dataset.weekshift){weekDate=add(weekDate,Number(el.dataset.weekshift));paint()}else if(el.dataset.weekday){weekDate=el.dataset.weekday;paint()}else if(el.dataset.addplan){const t=document.getElementById('planTitle').value.trim();if(!t){notify('予定名を入力してね');return}s.plans[weekDate]??=[];s.plans[weekDate].push({id:'custom-'+Date.now(),title:t,time:document.getElementById('planTime').value||'時間未定',duration:document.getElementById('planDuration').value||'自由',category:'追加'});save();paint();notify('予定を追加したよ')}else if(el.dataset.delplan){const id=el.dataset.delplan;if(id.startsWith('custom')){s.plans[weekDate]=(s.plans[weekDate]||[]).filter(p=>p.id!==id)}else{(s.weekOverrides[weekDate]??=[]).push(id)}save();paint();notify('この日の予定から外したよ')}else if(el.dataset.savejournal){s.journal[viewDate]={fact:document.getElementById('jfact').value,feeling:document.getElementById('jfeeling').value,honest:document.getElementById('jhonest').value,next:document.getElementById('jnext').value};save();notify('日記を保存したよ')}else if(el.dataset.export){const blob=new Blob([JSON.stringify({app:'ARC_LIFE_OS',version:1,exportedAt:new Date().toISOString(),data:s},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ARC_backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}else if(el.dataset.import){document.getElementById('importFile').click()}else if(el.dataset.reset){if(confirm('本当にすべての記録を消去しますか？ バックアップをおすすめします。')){s=blank();save();paint();notify('初期化しました')}}});document.addEventListener('change',e=>{const t=e.target;if(t.dataset.habit){s.habits[t.dataset.day]??={};s.habits[t.dataset.day][t.dataset.habit]=t.checked;save();paint();if(t.checked)notify('約束をひとつ積み上げた ✦')}if(t.id==='viewDate'||t.id==='journalDate'){viewDate=t.value||today();paint()}});document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const v=JSON.parse(await f.text());if(v.app!=='ARC_LIFE_OS'||!v.data||typeof v.data!=='object')throw Error('形式が違います');if(confirm('今の記録をバックアップの内容で置き換えますか？')){s={...blank(),...v.data};save();paint();notify('復元しました')}}catch(err){alert('バックアップを読み込めませんでした：'+err.message)}e.target.value=''});paint();
</script></body></html>
