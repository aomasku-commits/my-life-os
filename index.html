/* Phase 2 step 1: locally import an iCalendar file. No Google credentials or network requests. */
const questICSUnescape=v=>v.replace(/\\n/gi,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');
function questICSParseDate(raw,tzid){
 const v=(raw||'').trim();if(!/^\d{8}(T\d{6}Z?)?$/.test(v))return null;
 const y=+v.slice(0,4),m=+v.slice(4,6),d=+v.slice(6,8);
 if(m<1||m>12||d<1||d>31)return null;
 if(v.length===8)return {day:v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8),clock:'00:00',allDay:true};
 const hour=+v.slice(9,11),minute=+v.slice(11,13),sec=+v.slice(13,15);
 if(hour>23||minute>59||sec>59)return null;
 if(v.endsWith('Z')){
  const date=new Date(Date.UTC(y,m-1,d,hour,minute,sec));
  const datePart=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(date);
  const clock=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(date);
  return {day:datePart,clock,allDay:false};
 }
 // Google Calendar Japan export uses local time with TZID=Asia/Tokyo.
 // Reject other TZID values rather than silently shifting an event.
 if(tzid&&tzid!=='Asia/Tokyo')return null;
 return {day:v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8),clock:v.slice(9,11)+':'+v.slice(11,13),allDay:false};
}
function questICSRead(text){
 const rows=text.replace(/\r\n?/g,'\n').split('\n');const lines=[];
 for(const row of rows){if(/^[ \t]/.test(row)&&lines.length)lines[lines.length-1]+=row.slice(1);else lines.push(row);}
 const events=[];let ev=null;
 for(const line of lines){
  if(line==='BEGIN:VEVENT'){ev={};continue;}
  if(line==='END:VEVENT'){if(ev)events.push(ev);ev=null;continue;}
  if(!ev)continue;const k=line.indexOf(':');if(k<0)continue;
  const head=line.slice(0,k),value=line.slice(k+1),key=head.split(';')[0].toUpperCase();
  if(['DTSTART','DTEND','UID','SUMMARY','STATUS','RECURRENCE-ID'].includes(key))ev[key]={head,value};
 }
 return events;
}
function questICSImport(text){
 if(!/BEGIN:VCALENDAR/.test(text)||text.length>5000000)throw Error('正しい5MB以下の .ics ファイルを選んでね');
 const events=questICSRead(text);const base=today(),limit=add(base,13);let count=0,skipped=0;
 for(const ev of events){
  if(ev.STATUS?.value==='CANCELLED'||ev['RECURRENCE-ID']){skipped++;continue;}
  const rawStart=ev.DTSTART,rawEnd=ev.DTEND;if(!rawStart){skipped++;continue;}
  const tzMatch=rawStart.head.match(/TZID=([^;:]+)/i),tzid=tzMatch?.[1]||'';
  const start=questICSParseDate(rawStart.value,tzid);
  const end=rawEnd?questICSParseDate(rawEnd.value,rawEnd.head.match(/TZID=([^;:]+)/i)?.[1]||tzid):null;
  if(!start||start.allDay||start.day<base||start.day>limit){skipped++;continue;}
  const title=questICSUnescape(ev.SUMMARY?.value||'予定').trim().slice(0,90);
  if(!title){skipped++;continue;}
  const uid=(ev.UID?.value||title+'|'+start.day+'|'+start.clock).slice(0,250);
  const key=uid+'|'+start.day+'|'+start.clock;
  const dayItems=s.quests[start.day]??=[];
  if(dayItems.some(q=>q.calendarKey===key)){skipped++;continue;}
  // End may be on another day; cap quest duration to 10 hours.
  let minutes=25;if(end){const beginMs=Date.parse(start.day+'T'+start.clock+':00+09:00');const endMs=Date.parse(end.day+'T'+end.clock+':00+09:00');minutes=Math.min(600,Math.max(1,Math.round((endMs-beginMs)/60000)||25));}
  const id='ics-'+start.day+'-'+count+'-'+Math.random().toString(36).slice(2,8);
  dayItems.push({id,title,start:start.clock,end:end&&!end.allDay?end.clock:'自由',minutes,status:'pending',completedAt:null,calendarKey:key});
  s.quests[start.day]=dayItems;count++;
 }
 save();paint();notify(count+'件取り込み · '+skipped+'件スキップ');
 return {added:count,skipped};
}

function questClockRefresh(){if(active!=='home')return;const q=selectedQuest(),e=document.getElementById('qclock');if(!q||!e)return;const left=remainingQuest(q);e.textContent=showQuestTime(left);const fill=document.getElementById('qfill');if(fill)fill.style.width=Math.min(100,left/(q.minutes*60)*100)+'%';const label=document.getElementById('qstatus');if(label&&q.status==='running')label.textContent=left===0?'時間になったよ。延長してもOK':'集中タイム';const barTime=document.getElementById('questDockTime');if(barTime&&!document.getElementById('questDock').hidden)barTime.textContent=showQuestTime(left);}
setInterval(questClockRefresh,1000);document.addEventListener('visibilitychange',questClockRefresh);
document.addEventListener('click',function(event){
 const select=event.target.closest('[data-qselect]'),remove=event.target.closest('[data-qremove]'),action=event.target.closest('[data-qact]');
 if(!select&&!remove&&!action)return;
 event.preventDefault();
 if(select){selectedQuestId=select.dataset.qselect;localStorage.setItem('lifeos_selected_quest',selectedQuestId);paint();return;}
 if(remove){const id=remove.dataset.qremove;if(!confirm('このクエストを削除しますか？'))return;s.quests[today()]=todaysQuests().filter(q=>q.id!==id);delete s.questSessions[id];if(selectedQuestId===id)selectedQuestId=null;save();paint();return;}
 const kind=action.dataset.qact;
 if(kind==='import-ics'){document.getElementById('quest-ics-input')?.click();return;}
 if(kind==='import-week'){copyWeeklyPlansToQuests();return;}
 if(kind==='add'){const title=document.getElementById('qtitle').value.trim(),minutes=Number(document.getElementById('qminutes').value);if(!title||!Number.isInteger(minutes)||minutes<1||minutes>600){notify('名前と1～600分を入力してね');return;}const id='q-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);(s.quests[today()]??=[]).push({id,title,start:'自由',end:'自由',minutes,status:'pending',completedAt:null});selectedQuestId=id;localStorage.setItem('lifeos_selected_quest',id);save();paint();return;}
 const q=selectedQuest();if(!q)return;
 const z=s.questSessions[q.id]??={ms:q.minutes*60000,at:null};
 if(kind==='complete'){if(q.status==='done')return;const before=questRank();const remainingMs=remainingQuest(q)*1000;q.status='done';q.completedAt=new Date().toISOString();z.ms=remainingMs;z.at=null;save();paint();questCelebrate(q.title,questRank()>before);return;}
 if(kind==='toggle'){if(q.status==='running'){z.ms=Math.max(0,z.ms-(Date.now()-z.at));z.at=null;q.status='paused';}else{if(remainingQuest(q)===0){notify('5分延長してね');return;}for(const other of todaysQuests()){if(other.id!==q.id&&other.status==='running'){const session=s.questSessions[other.id];if(session){session.ms=Math.max(0,session.ms-(Date.now()-session.at));session.at=null;}other.status='paused';}}z.at=Date.now();q.status='running';}save();paint();return;}
 if(kind==='extend'){z.ms=remainingQuest(q)*1000+300000;z.at=q.status==='running'?Date.now():null;save();paint();notify('5分延長したよ');return;}
 if(kind==='undo'){if(q.status!=='done')return;q.status='paused';q.completedAt=null;const session=s.questSessions[q.id];if(session){session.at=null;if(session.ms<=0)session.ms=q.minutes*60000;}save();paint();notify('完了を取り消したよ');return;}
 if(kind==='next'){const qs=todaysQuests(),i=qs.findIndex(x=>x.id===q.id);const next=qs.slice(i+1).find(x=>x.status!=='done')||qs.find(x=>x.status!=='done');if(next){selectedQuestId=next.id;localStorage.setItem('lifeos_selected_quest',next.id);}paint();}
});

function blankWorkout() {
  return {sessions: [], draft: null};
}

const workoutKey = name => name.normalize('NFKC').replace(/[\s・]/g, '').toLowerCase();
const exerciseAliases = new Map([
  ['bp', 'ベンチプレス'], ['ベンチ', 'ベンチプレス'], ['benchpress', 'ベンチプレス'],
  ['sq', 'スクワット'], ['バーベルスクワット', 'スクワット'],
  ['lpd', 'ラットプルダウン'], ['ラットプル', 'ラットプルダウン'],
  ['インクラインdb', 'インクラインダンベルプレス']
]);
const exerciseName = name => exerciseAliases.get(workoutKey(name)) || name;
const exerciseUnit = exercise => /プランク|壁座り|ウォールシット|dead\s*hang|plank/i.test(exerciseName(exercise)) ? '秒' : '回';
const workoutDateLabel = date => date.slice(0, 4) === today().slice(0, 4) ? fmt(date) : date;

function parseExercises(value) {
  const unique = new Map();
  for (const part of value.split(/[\n、，,／/]+/)) {
    const name = exerciseName(part.trim().replace(/^[・●⚫\-*]\s*/, ''));
    if (name && !unique.has(workoutKey(name))) unique.set(workoutKey(name), name);
  }
  return [...unique.values()];
}

function lastWorkoutExercise(name, date) {
  const matches = s.workout.sessions.filter(session =>
    session.date <= date && session.exercises.some(exercise => workoutKey(exerciseName(exercise.name)) === workoutKey(name))
  );
  const session = matches.sort((a, b) => b.date.localeCompare(a.date) || b.number - a.number)[0];
  return session?.exercises.find(exercise => workoutKey(exerciseName(exercise.name)) === workoutKey(name));
}

function suggestWorkout(name, short, date) {
  const mainLift = /スクワット|ベンチプレス|デッドリフト|レッグプレス|懸垂|チンニング|pull.?up|deadlift|squat|bench/i.test(name);
  const unit = exerciseUnit(name);
  return {
    name,
    unit,
    targetSets: short ? 1 : mainLift ? 3 : 2,
    targetReps: unit === '秒' ? '20〜30' : mainLift ? '6〜10' : '8〜12',
    last: lastWorkoutExercise(name, date)?.sets ?? [],
    sets: [],
    input: {weight: '', reps: ''}
  };
}

function workoutSetLabel(set, unit = '回') {
  return `${set.weight == null ? '' : `${set.weight} kg × `}${set.reps}${unit}`;
}

function workoutInputDraft() {
  const draft = s.workout.draft ??= {stage: 'input'};
  if (draft.stage !== 'record') {
    draft.names = document.getElementById('workout-names').value;

    draft.mode = document.getElementById('workout-mode').value;
    if (draft.stage === 'plan' && (
      draft.names !== draft.plannedNames || draft.date !== draft.plannedDate || draft.mode !== draft.plannedMode
    )) draft.stage = 'input';
  }
  save();
  return draft;
}

function workoutAddSet(exercise, set) {
  exercise.sets.push({...set});
  exercise.input = {weight: set.weight ?? '', reps: set.reps};
  save();
  paint();
  notify(`${exercise.sets.length}セット目を記録したよ`);
}

document.addEventListener('input', event => {

    draft.exercises[draft.index].input[input.id === 'workout-kg' ? 'weight' : 'reps'] = input.value;

document.addEventListener('submit', event => {
  if (event.target.id === 'workout-plan') {
    event.preventDefault();
    const draft = workoutInputDraft();
    const names = parseExercises(draft.names);
    if (!names.length || names.length > 20) {
      notify('種目を1〜20個入力してね');
      return;
    }
    Object.assign(draft, {
      stage: 'plan', index: 0,
      plannedNames: draft.names, plannedDate: draft.date, plannedMode: draft.mode,
      exercises: names.map(name => suggestWorkout(name, draft.mode === 'short', draft.date))
    });
    save();
    paint();
    document.querySelector('[data-workout-action="start"]').focus();
  } else if (event.target.id === 'workout-set') {
    event.preventDefault();
    const draft = s.workout.draft;
    const exercise = draft.exercises[draft.index];
    const weightInput = document.getElementById('workout-kg').value.normalize('NFKC').trim().replace(',', '.');
    const repsInput = document.getElementById('workout-reps').value.normalize('NFKC').trim();
    const weight = weightInput === '' ? null : Number(weightInput);
    const reps = Number(repsInput);
    const status = document.getElementById('workout-status');
    if (weight !== null && (!/^\d+(?:\.\d+)?$/.test(weightInput) || !Number.isFinite(weight))) {
      status.textContent = '重量は0以上の数字で入力してね。';
      document.getElementById('workout-kg').focus();
      return;
    }
    if (!/^\d+$/.test(repsInput) || reps < 1) {
      status.textContent = `${exercise.unit === '秒' ? '秒数' : '回数'}は1以上の整数で入力してね。`;
      document.getElementById('workout-reps').focus();

document.addEventListener('click', event => {
  const button = event.target.closest('[data-workout-action]');
  if (!button || button.disabled) return;
  const action = button.dataset.workoutAction;
  if (action === 'previous') {
    const input = document.getElementById('workout-names');
    input.value = s.workout.sessions.at(-1).exercises.map(exercise => exercise.name).join('、');
    input.dispatchEvent(new Event('input', {bubbles:true}));
    input.focus();
    return;
  }
  const draft = s.workout.draft;
  if (!draft) return;
  const exercise = draft.exercises[draft.index];
  if (action === 'repeat') {
    const last = exercise.sets.at(-1) ?? exercise.last.at(-1);
    if (last) workoutAddSet(exercise, last);
    return;
  }
  if (action === 'start' && draft.stage === 'plan') draft.stage = 'record';
  if (action === 'replan') draft.stage = 'plan';
  if (action === 'remove') exercise.sets.splice(Number(button.dataset.setIndex), 1);
  if (action === 'next') draft.index++;
  if (action === 'back') draft.index--;
  if (action === 'finish') {
    const exercises = draft.exercises.filter(entry => entry.sets.length).map(({name,unit,sets}) => ({name,unit,sets}));
    if (!exercises.length) return;
    const number = s.workout.sessions.length + 1;
    s.workout.sessions.push({number, date:draft.date, exercises});
    s.workout.draft = null;
    save();
    paint();
    scrollTo(0,0);
    notify(number % 5 === 0 ? `累計${number}回達成！ ✦` : `第${number}回、積み上げたよ ✦`);
    return;
  }
  save();
  paint();
  if (['start','next','back'].includes(action)) {
    document.getElementById('workout-exercise').focus();
    scrollTo(0,0);
  }
});

/* Import contract: a session {date:"YYYY-MM-DD", exercises:[{name,sets:[{weight,reps}]}]}
   or {sessions:[...]} or an array of sessions.  Confirm URL imports before mutation. */
function workoutNormalizeImport(raw){
 const arr=Array.isArray(raw)?raw:Array.isArray(raw?.sessions)?raw.sessions:[raw];
 if(arr.length<1||arr.length>100)throw Error('1〜100回分のセッションを指定してください');
 return arr.map((session)=>{
  if(!session||typeof session!=='object'||!/^20\d\d-\d\d-\d\d$/.test(session.date)||!Number.isFinite(dayDate(session.date).getTime())||iso(dayDate(session.date))!==session.date||session.date>today())throw Error('日付は今日以前のYYYY-MM-DD形式で指定してください');
  if(!Array.isArray(session.exercises)||!session.exercises.length||session.exercises.length>35)throw Error('種目は1〜35個で指定してください');
  const exercises=session.exercises.map(ex=>{
   if(typeof ex.name!=='string'||!ex.name.trim()||ex.name.length>80)throw Error('種目名が不正です');
   if(!Array.isArray(ex.sets)||!ex.sets.length||ex.sets.length>30)throw Error('各種目のセットは1〜30件にしてください');
   const unit=ex.unit==='秒'?'秒':'回';
   const sets=ex.sets.map(set=>{
    const weight=set.weight===null||set.weight===undefined||set.weight===''?null:Number(set.weight);
    const reps=Number(set.reps);
    if((weight!==null&&(!Number.isFinite(weight)||weight<0||weight>1000))||!Number.isInteger(reps)||reps<1||reps>10000)throw Error('重量か回数が不正です');
    return {weight,reps};
   });
   return {name:exerciseName(ex.name.trim()),unit,sets};
  });
  return {date:session.date,exercises};
 });
}
function workoutFingerprint(session){
 const canonical=(session.exercises||[]).map(ex=>[workoutKey(exerciseName(ex.name)),(ex.sets||[]).map(set=>[set.weight==null?null:Number(set.weight),Number(set.reps)])]);
 return JSON.stringify([session.date,canonical]);
}
function workoutImport(raw){
 const incoming=workoutNormalizeImport(raw),existing=new Set(s.workout.sessions.map(workoutFingerprint));
 let added=0;
 for(const session of incoming){
  const key=workoutFingerprint(session);
  if(existing.has(key))continue;
  existing.add(key);
  s.workout.sessions.push({...session,number:s.workout.sessions.length+1});
  added++;
 }
 if(added){save();paint();}
 notify(added?added+'回分のトレーニングを連携しました ✦':'すべて登録済み。重複はありません');
 return added;
}
function workoutLiftHistory(name){
 const history=[];
 for(const session of s.workout.sessions){
  const sets=(session.exercises||[]).filter(e=>workoutKey(exerciseName(e.name))===workoutKey(name)).flatMap(e=>e.sets||[]);
  const values=sets.map(set=>Number(set.weight)).filter(v=>Number.isFinite(v)&&v>0);
  if(values.length)history.push({date:session.date,weight:Math.max(...values)});
 }
 const days=new Map();
 for(const v of history)days.set(v.date,Math.max(v.weight,days.get(v.date)||0));
 return [...days].sort((a,b)=>a[0].localeCompare(b[0])).map(([date,weight])=>({date,weight}));
}
function workoutChart(history){
 if(!history.length)return '<p class="empty">記録を取り込むと、ここに重量の推移が表示されるよ。</p>';
 const points=history.slice(-24),vals=points.map(v=>v.weight),lo=Math.max(0,Math.floor((Math.min(...vals)-5)/5)*5),hi=Math.max(lo+10,Math.ceil((Math.max(...vals)+5)/5)*5);
 const coords=points.map((v,i)=>({x:points.length===1?160:32+i*256/(points.length-1),y:145-(v.weight-lo)/(hi-lo)*110}));
 const path=coords.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
 return '<svg class="lift-chart" viewBox="0 0 320 185" role="img" aria-label="保存されたベンチプレス重量の推移"><path d="M32 35 V145 H288" fill="none" stroke="#596984"/>'+
 '<text x="2" y="39">'+hi+'kg</text><text x="2" y="146">'+lo+'kg</text><path class="line" d="'+path+'"/>'+
 coords.map((p,i)=>'<circle class="dot" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4"><title>'+esc(points[i].date)+' '+points[i].weight+'kg</title></circle>').join('')+
 '<text x="32" y="166">'+esc(points[0].date.slice(5))+'</text><text x="288" y="166" text-anchor="end">'+esc(points.at(-1).date.slice(5))+'</text></svg>';

 '<div style="border-top:1px solid #58736a;padding-top:13px;margin-top:12px"><h3>🎤 今日の練習ログ</h3>'+
 '<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="vocal-practiced" '+(log.practiced?'checked':'')+'> 今日、歌の練習をした</label>'+
 '<textarea class="field" id="vocal-notes" rows="3" maxlength="1000" placeholder="今日できたこと・改善点・次回の課題">'+esc(log.notes||'')+'</textarea>'+
 '<button type="button" class="button secondary" id="vocal-save">🍏 練習を記録する</button></div>'+
 '<p class="tip">記録はこの端末のLIFE OSに保存。評価はいつでも更新できるよ。</p></div>';
}
document.addEventListener('change',e=>{
 const b=e.target.closest('[data-vocal-score]');if(!b)return;
 const id=b.dataset.vocalScore;if(!vocalSkills.some(x=>x[0]===id))return;
 vocalState().scores[id]=Number(b.value);save();paint();notify('歌唱スキルの進捗を保存したよ 🍏');
});
document.addEventListener('click',e=>{
 if(!e.target.closest('#vocal-save'))return;
 const v=vocalState();v.logs[today()]={practiced:!!document.getElementById('vocal-practiced')?.checked,notes:(document.getElementById('vocal-notes')?.value||'').trim().slice(0,1000)};
 save();paint();notify('今日のボイトレを記録したよ 🎤');
});

paint();
workoutHashImport();
</script></body></html>
