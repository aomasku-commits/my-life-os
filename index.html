   /* Prioritize the completed item; retain its id to preserve achievement linkage. */
   if(q.status==='done'&&same.status!=='done'){
    const pos=kept.indexOf(same);kept[pos]=q;
    qMergeDuplicate(q,same,day);
    s.questDuplicateArchive.push({day,mergedAt:new Date().toISOString(),record:same,mergedInto:q.id});
   }else{
    qMergeDuplicate(same,q,day);
    s.questDuplicateArchive.push({day,mergedAt:new Date().toISOString(),record:q,mergedInto:same.id});
   }
   removed++;
  }
  if(kept.length!==items.length)s.quests[day]=kept;
 }
 if(removed){save();notify('重複クエスト '+removed+'件を整理したよ。元の記録はバックアップに保持しているよ');}
 return removed;
}

async function gcalFetchAndImport(token){
 const base=today(),limit=add(base,14);
 const from=new Date(base+'T00:00:00+09:00').toISOString();
 const to=new Date(limit+'T00:00:00+09:00').toISOString();
 let tokenPage='',pages=0,seen=0;
 const events=[];
 do{
  const url=new URL('https://www.googleapis.com/calendar/v3/calendars/primary/events');
  url.searchParams.set('timeMin',from);url.searchParams.set('timeMax',to);
  url.searchParams.set('singleEvents','true');url.searchParams.set('orderBy','startTime');url.searchParams.set('maxResults','250');
  if(tokenPage)url.searchParams.set('pageToken',tokenPage);
  const response=await fetch(url.toString(),{headers:{Authorization:'Bearer '+token},cache:'no-store'});
  if(!response.ok){const body=await response.json().catch(()=>({}));throw Error('Google API '+response.status+'：'+(body.error?.message||'権限を確認してね'));}
  const result=await response.json();
  events.push(...(result.items||[]));seen+=(result.items||[]).length;
  tokenPage=result.nextPageToken||'';pages++;
 }while(tokenPage&&pages<12);
 // Only change quest records after all pages have been received.
 const changed={added:0,updated:0,unavailable:0};
 for(const ev of events){
  const result=gcalImportEvent(ev);
  changed.added+=result.added;changed.updated+=result.updated;
 }
 // Missing events may have been canceled, moved out of range or deleted.
 // Keep original records, achievements, and local edits; visibly flag only.
 if(!tokenPage){
  const activeIds=new Set(events.filter(e=>e.status!=='cancelled').map(e=>String(e.id||e.iCalUID||'')));
  for(const [day,items] of Object.entries(s.quests)){
   if(day<base||day>=limit)continue;
   for(const q of items){
    if(!q.gcalKey||q.status==='done'||q.editedLocally)continue;
    if(!activeIds.has(q.gcalKey)&&!q.calendarUnavailable){q.calendarUnavailable=true;changed.unavailable++;}
   }
  }
 }
 qDeduplicate();
 s.lastGcalSyncAt=new Date().toISOString();
 save();paint();
 return {...changed,seen,more:!!tokenPage};
}

/* Phase 2 step 1: locally import an iCalendar file. No Google credentials or network requests. */
const questICSUnescape=v=>v.replace(/\\n/gi,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');
function questICSParseDate(raw,tzid){
 const v=(raw||'').trim();if(!/^\d{8}(T\d{6}Z?)?$/.test(v))return null;
 const y=+v.slice(0,4),m=+v.slice(4,6),d=+v.slice(6,8);
 if(m<1||m>12||d<1||d>31)return null;
 if(v.length===8)return {day:v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8),clock:'00:00',allDay:true};
 const hour=+v.slice(9,11),minute=+v.slice(11,13),sec=+v.slice(13,15);
 if(hour>23||minute>59||sec>59)return null;
 if(v.endsWith('Z')){
  const date=new Date(Date.UTC(y,m-1,d,hour,minute,sec));
  const datePart=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(date);
  const clock=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(date);
  return {day:datePart,clock,allDay:false};
 }
 // Google Calendar Japan export uses local time with TZID=Asia/Tokyo.
 // Reject other TZID values rather than silently shifting an event.
 if(tzid&&tzid!=='Asia/Tokyo')return null;
 return {day:v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8),clock:v.slice(9,11)+':'+v.slice(11,13),allDay:false};
}
function questICSRead(text){
 const rows=text.replace(/\r\n?/g,'\n').split('\n');const lines=[];
 for(const row of rows){if(/^[ \t]/.test(row)&&lines.length)lines[lines.length-1]+=row.slice(1);else lines.push(row);}
 const events=[];let ev=null;
 for(const line of lines){
  if(line==='BEGIN:VEVENT'){ev={};continue;}
  if(line==='END:VEVENT'){if(ev)events.push(ev);ev=null;continue;}
  if(!ev)continue;const k=line.indexOf(':');if(k<0)continue;
  const head=line.slice(0,k),value=line.slice(k+1),key=head.split(';')[0].toUpperCase();
  if(['DTSTART','DTEND','UID','SUMMARY','STATUS','RECURRENCE-ID'].includes(key))ev[key]={head,value};
 }
 return events;
}
function questICSImport(text){

 const events=questICSRead(text);const base=today(),limit=add(base,13);let count=0,skipped=0;
 for(const ev of events){
  if(ev.STATUS?.value==='CANCELLED'||ev['RECURRENCE-ID']){skipped++;continue;}
  const rawStart=ev.DTSTART,rawEnd=ev.DTEND;if(!rawStart){skipped++;continue;}
  const tzMatch=rawStart.head.match(/TZID=([^;:]+)/i),tzid=tzMatch?.[1]||'';
  const start=questICSParseDate(rawStart.value,tzid);
  const end=rawEnd?questICSParseDate(rawEnd.value,rawEnd.head.match(/TZID=([^;:]+)/i)?.[1]||tzid):null;
  if(!start||start.allDay||start.day<base||start.day>limit){skipped++;continue;}
  const title=questICSUnescape(ev.SUMMARY?.value||'予定').trim().slice(0,90);
  if(!title){skipped++;continue;}
  const uid=(ev.UID?.value||title+'|'+start.day+'|'+start.clock).slice(0,250);
  const key=uid+'|'+start.day+'|'+start.clock;
  const dayItems=s.quests[start.day]??=[];
  if(dayItems.some(q=>q.calendarKey===key)){skipped++;continue;}
  // End may be on another day; cap quest duration to 10 hours.
  let minutes=25;if(end){const beginMs=Date.parse(start.day+'T'+start.clock+':00+09:00');const endMs=Date.parse(end.day+'T'+end.clock+':00+09:00');minutes=Math.min(600,Math.max(1,Math.round((endMs-beginMs)/60000)||25));}
  const id='ics-'+start.day+'-'+count+'-'+Math.random().toString(36).slice(2,8);
  dayItems.push({id,title,start:start.clock,end:end&&!end.allDay?end.clock:'自由',minutes,status:'pending',completedAt:null,calendarKey:key});
  s.quests[start.day]=dayItems;count++;
 }
 save();paint();notify(count+'件取り込み · '+skipped+'件スキップ');

}

 '<div class="qadd"><input class="field" id="qfuture-title" maxlength="90" placeholder="未来のクエストを追加"><input class="field" type="number" id="qfuture-minutes" min="1" max="600" value="25" aria-label="分数"><button type="button" data-qfuture-add="1">＋追加</button></div>'+
 '<p class="qhint">.icsから読み込んだ明日以降の予定もここに表示されるよ。「予定の編集」はGoogleと同期できるよ。「実績」はLIFE OSだけに記録して、Googleの予定を勝手に変更しないよ。</p></div>';

document.addEventListener('change',e=>{
 if(e.target.id!=='qfuture-date')return;
 const v=e.target.value;if(v<today()||v>add(today(),30))return;
 questPreviewDay=v;paint();
});
document.addEventListener('click',e=>{
 const edit=e.target.closest('[data-qedit]'),del=e.target.closest('[data-qfuture-remove]'),addBtn=e.target.closest('[data-qfuture-add]');
 if(!edit&&!del&&!addBtn)return;e.preventDefault();
 const day=questPreviewDay;if(day<today()||day>add(today(),30)){notify('日付を選び直してね');return;}
 const qs=s.quests[day]??=[];
 if(addBtn){

  qs.push({id:'future-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),title,start:'自由',end:'自由',minutes,status:'pending',completedAt:null,gcalPendingCreate:true});
  s.quests[day]=qs;save();paint();notify('予定を追加したよ');return;
 }
 const id=edit?.dataset.qedit||del?.dataset.qfutureRemove;
 const q=qs.find(x=>x.id===id);if(!q)return;
 if(del){
  if(!confirm('この日のクエストを削除しますか？'))return;
  s.quests[day]=qs.filter(x=>x.id!==id);delete s.questSessions[id];save();paint();return;
 }
 const title=prompt('クエスト名を編集',q.title);if(title===null)return;
 const clean=title.trim().slice(0,90);if(!clean){notify('名前を入力してね');return;}
 const minutesValue=prompt('所要時間（分、1〜600）',String(q.minutes));
 if(minutesValue===null)return;

 const start=prompt('開始時刻（HH:MM、または「自由」）',q.start||'自由');if(start===null)return;
 if(start!=='自由'&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(start)){notify('開始時刻は HH:MM で入力してね');return;}
 const end=start==='自由'?'自由':(()=>{const total=Number(start.slice(0,2))*60+Number(start.slice(3))+minutes;return String(Math.floor(total/60)%24).padStart(2,'0')+':'+String(total%60).padStart(2,'0')})();
 qPlanRevision(q,day,{title:clean,start,end,minutes},'LIFE OS');
 q.editedLocally=true;q.title=clean;q.minutes=minutes;q.start=start;q.end=end;
 // Editing a running task would invalidate the clock; stop it and reset its duration.
 if(q.status==='running'){q.status='paused';}
 s.questSessions[q.id]={ms:minutes*60000,at:null};
 save();paint();notify('クエストを更新したよ');
});

 if(!select&&!remove&&!action&&!undo)return;
 if(undo){const q=todaysQuests().find(x=>x.id===undo.dataset.qundo);if(!q||q.status!=='done')return;
  q.status='paused';q.completedAt=null;if(q.actual?.source==='completion')delete q.actual;

 const kind=action.dataset.qact;

 if(kind==='add'){const title=document.getElementById('qtitle').value.trim(),minutes=Number(document.getElementById('qminutes').value);if(!title||!Number.isInteger(minutes)||minutes<1||minutes>600){notify('名前と1～600分を入力してね');return;}const id='q-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);(s.quests[today()]??=[]).push({id,title,start:'自由',end:'自由',minutes,status:'pending',completedAt:null,gcalPendingCreate:true});selectedQuestId=id;localStorage.setItem('lifeos_selected_quest',id);save();paint();return;}
 const q=selectedQuest();if(!q)return;

 if(kind==='complete'){if(q.status==='done')return;const before=questRank();const remainingMs=remainingQuest(q)*1000;q.status='done';q.completedAt=new Date().toISOString();qActualDefault(q);z.ms=remainingMs;z.at=null;save();paint();questCelebrate(q.title,questRank()>before);return;}
 if(kind==='toggle'){if(q.status==='running'){z.ms=Math.max(0,z.ms-(Date.now()-z.at));z.at=null;q.status='paused';}else{if(remainingQuest(q)===0){notify('5分延長してね');return;}for(const other of todaysQuests()){if(other.id!==q.id&&other.status==='running'){const session=s.questSessions[other.id];if(session){session.ms=Math.max(0,session.ms-(Date.now()-session.at));session.at=null;}other.status='paused';}}z.at=Date.now();q.status='running';}save();paint();return;}
 if(kind==='extend'){z.ms=remainingQuest(q)*1000+300000;z.at=q.status==='running'?Date.now():null;save();paint();notify('5分延長したよ');return;}
 if(kind==='undo'){if(q.status!=='done')return;q.status='paused';q.completedAt=null;if(q.actual?.source==='completion')delete q.actual;const session=s.questSessions[q.id];if(session){session.at=null;if(session.ms<=0)session.ms=q.minutes*60000;}save();paint();notify('完了を取り消したよ');return;}
 if(kind==='next'){const qs=todaysQuests(),i=qs.findIndex(x=>x.id===q.id);const next=qs.slice(i+1).find(x=>x.status!=='done')||qs.find(x=>x.status!=='done');if(next){selectedQuestId=next.id;localStorage.setItem('lifeos_selected_quest',next.id);}paint();}
});

/* GROWTH TREE: progress is derived from existing saved records only. */
const growthBranches=[
 ['body','💪','身体','筋トレ・食事・健康'],
 ['work','🚀','仕事','マーケティング・発信・事業'],
 ['heart','🫧','心','自己受容・日記・瞑想'],
 ['voice','🎤','歌','ボイトレ・表現'],
 ['learn','📚','教養','読書・心理学・学び直し']
];
let growthChosen='body';
function growthBranchForQuest(q){
 const t=String(q.title||'').normalize('NFKC').toLowerCase();
 if(/ボイトレ|発声|歌|カラオケ|ダーリン/.test(t))return 'voice';
 if(/筋トレ|ジム|プール|水泳|運動|食事|料理|ご飯|丼|ランチ|自炊|睡眠/.test(t))return 'body';
 if(/瞑想|感情|日記|ジャーナル|自己受容|セルフイメージ|五感/.test(t))return 'heart';
 if(/心理学|読書|勉強|教養|歴史|政治|経済|学習/.test(t))return 'learn';
 if(/仕事|チャイハナ|マーケ|独立|コーチング|life os|発信|ラジオ|収録|副業|営業/.test(t))return 'work';
 return null;
}
function growthScores(){
 const out=Object.fromEntries(growthBranches.map(b=>[b[0],{xp:0,quests:0,records:0}]));
 for(const list of Object.values(s.quests||{})){
  if(!Array.isArray(list))continue;
  for(const q of list){
   if(q.status!=='done')continue;
   const type=growthBranchForQuest(q);if(!type)continue;
   out[type].quests++;out[type].xp+=10;
  }
 }
 const workouts=Array.isArray(s.workout?.sessions)?s.workout.sessions.length:0;
 out.body.xp+=workouts*15;out.body.records+=workouts;
 const journalDays=Object.values(s.journal||{}).filter(j=>j&&typeof j==='object'&&Object.values(j).some(v=>typeof v==='string'&&v.trim())).length;
 out.heart.xp+=journalDays*5;out.heart.records+=journalDays;
 const vocalDays=Object.values(s.vocalGoal?.logs||{}).filter(x=>x?.practiced===true).length;
 out.voice.xp+=vocalDays*10;out.voice.records+=vocalDays;
 for(const v of Object.values(out)){v.level=1+Math.floor(v.xp/100);v.percent=v.xp%100;}
 return out;
}

/* SKILL PATH: auto unlock from existing records and manual self-attested milestones. */
const growthSkills={"body":[["始める","筋トレを1回記録","workouts",1],["土台をつくる","筋トレを5回記録","workouts",5],["食事と運動","身体のクエストを5回完了","bodyQuests",5],["続ける力","筋トレを10回記録","workouts",10],["自分の身体づくり","続けたい運動習慣を自分で決める","manual",1]],"work":[["価値の一歩","仕事クエストを1回完了","workQuests",1],["発信の習慣","仕事クエストを3回完了","workQuests",3],["サービスの種","届けたい相手と価値を整理する","manual",1],["伴走の実験","小さなセッションを試す","manual",1],["独立への基盤","仕事クエストを5回完了","workQuests",5]],"heart":[["自分の声","日記を1日記録","journals",1],["自己観察","日記を5日記録","journals",5],["心の時間","心のクエストを3回完了","heartQuests",3],["自分の味方","自分への優しい言葉を見つける","manual",1],["やさしい継続","日記を10日記録","journals",10]],"voice":[["声を出す","ボイトレを1日記録","vocalLogs",1],["声の土台","ボイトレを3日記録","vocalLogs",3],["歌詞を覚える","課題曲を歌詞を見ずに歌う","manual",1],["ヘッドボイス","力まず声区を切り替える練習をする","manual",1],["表現のステージ","人前で一曲を歌いきる","manual",1]],"learn":[["学び始める","教養クエストを1回完了","learnQuests",1],["知識を広げる","教養クエストを3回完了","learnQuests",3],["言葉にする","学んだことを自分の言葉で説明する","manual",1],["知識を積み重ねる","教養クエストを5回完了","learnQuests",5],["学びの地図","次に学びたいテーマを3つ選ぶ","manual",1]]};
function growthSkillChecks(){
 const counts={bodyQuests:0,workQuests:0,heartQuests:0,learnQuests:0};
 for(const list of Object.values(s.quests||{}))if(Array.isArray(list))for(const q of list){
  if(q.status!=='done')continue;
  const kind=growthBranchForQuest(q),key=kind+'Quests';if(key in counts)counts[key]++;
 }
 return {...counts,workouts:Array.isArray(s.workout?.sessions)?s.workout.sessions.length:0,
  journals:Object.values(s.journal||{}).filter(j=>j&&typeof j==='object'&&Object.values(j).some(v=>typeof v==='string'&&v.trim())).length,
  vocalLogs:Object.values(s.vocalGoal?.logs||{}).filter(v=>v?.practiced===true).length};
}
function growthSkillState(branch){
 const defs=growthSkills[branch]||[],metrics=growthSkillChecks(),man=s.growthSkillManual||{};
 let previous=true;
 return defs.map((d,i)=>{
  const key=branch+'-'+i;
  const count=d[2]==='manual'?(man[key]?1:0):Math.min(d[3],Math.max(0,Number(metrics[d[2]])||0));
  const eligible=previous,done=eligible&&count>=d[3];
  previous=done;
  return {key,def:d,count,eligible,done,manual:d[2]==='manual'};
 });
}
function growthSkillTreeHTML(){
 const items=growthSkillState(growthChosen),done=items.filter(x=>x.done).length;
 return '<div class="skillpath"><div class="skillpath-header"><div><span class="growth-eyebrow">SKILL PATH</span><h3>スキル解放ルート</h3></div><strong>'+done+' / '+items.length+'</strong></div>'+
 '<p class="skillpath-info">前のスキルから順番に育つよ。自動達成と、自分で認める達成があるよ。</p>'+
 items.map((x,i)=>'<div class="skillnode '+(x.done?'unlocked':x.eligible?'ready':'locked')+'"><span class="skillnode-step">'+(i+1)+'</span><div class="skillnode-main"><strong>'+(x.done?'🌿 ':x.eligible?'✨ ':'🔒 ')+esc(x.def[0])+'</strong><p>'+esc(x.def[1])+'</p><small>'+(x.manual?'自分で達成を確認':x.count+' / '+x.def[3])+' · '+(x.done?'解放済み':x.eligible?'挑戦できる':'前のスキルを解放すると挑戦できる')+'</small>'+
 (x.manual&&x.eligible?'<button type="button" class="skillnode-action" data-growth-skill="'+x.key+'">'+(x.done?'↩ 達成を取り消す':'✓ 達成を記録')+'</button>':'')+'</div></div>').join('')+
 '<p class="skillpath-note">スキルの解放は成長を眺めるための実績。XPの二重加算や、できない日の減点はしないよ。</p></div>';
}
document.addEventListener('click',event=>{
 const b=event.target.closest('[data-growth-skill]');if(!b)return;
 const key=b.dataset.growthSkill,valid=growthSkillState(growthChosen).find(x=>x.key===key);
 if(!valid||!valid.manual||!valid.eligible)return;
 if(!s.growthSkillManual||typeof s.growthSkillManual!=='object')s.growthSkillManual={};
 if(s.growthSkillManual[key])delete s.growthSkillManual[key];
 else s.growthSkillManual[key]=new Date().toISOString();
 save();paint();notify(s.growthSkillManual[key]?'🍏 スキル解放！':'達成を戻したよ');
});

function growthTreeHTML(){
 const scores=growthScores(),branch=growthBranches.find(b=>b[0]===growthChosen)||growthBranches[0],v=scores[branch[0]];
 return '<section class="growth-tree" id="growth-tree"><span class="growth-eyebrow">✳ BLOOM GROWTH TREE</span>'+
 '<h2>人生の成長ツリー</h2><p class="growth-intro">小さな行動で、5つの芽を育てよう。</p>'+
 '<div class="growth-tree-art" aria-hidden="true"><div class="growth-canopy">'+growthBranches.map(b=>'<span>'+b[1]+'</span>').join('')+'</div><div class="growth-trunk"></div><span>🍏</span></div>'+
 '<div class="growth-branches">'+growthBranches.map(b=>{const z=scores[b[0]],chosen=b[0]===growthChosen;return '<button type="button" class="growth-branch '+(chosen?'chosen':'')+'" data-growth-branch="'+b[0]+'" aria-pressed="'+chosen+'"><span class="growth-icon">'+b[1]+'</span><span>'+b[2]+'</span><strong>Lv.'+z.level+'</strong><i><b style="width:'+z.percent+'%"></b></i></button>';}).join('')+'</div>'+
 '<div class="growth-detail"><span class="growth-eyebrow">SELECTED BRANCH</span><h3>'+branch[1]+' '+branch[2]+' <span>Lv.'+v.level+'</span></h3><p>'+branch[3]+'</p>'+
 '<div class="growth-points"><strong>'+v.xp+' XP</strong><span>次のレベルまで '+(100-v.percent)+' XP</span></div>'+
 '<div class="growth-bar" role="progressbar" aria-label="次のレベルまで" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+v.percent+'"><i style="width:'+v.percent+'%"></i></div>'+
 '<div class="growth-evidence"><span>関連クエスト '+v.quests+'件クリア</span><span>関連記録 '+v.records+'件</span></div>'+
 '<div class="growth-milestones"><span class="active">🌱 Lv.1 芽吹き</span><span class="'+(v.level>=2?'active':'')+'">🌿 Lv.2 根づく</span><span class="'+(v.level>=3?'active':'')+'">🌳 Lv.3 育つ</span></div>'+
 growthSkillTreeHTML()+
 '<p class="growth-note">関連クエスト完了：10 XP／筋トレ記録：15 XP／日記：5 XP／ボイトレ練習：10 XP。記録がない日も減点しないよ。</p></div></section>';
}

function blankWorkout() {
  return {sessions: [], draft: null};
}

const workoutKey = name => name.normalize('NFKC').replace(/[\s・]/g, '').toLowerCase();
const exerciseAliases = new Map([
  ['bp', 'ベンチプレス'], ['ベンチ', 'ベンチプレス'], ['benchpress', 'ベンチプレス'],
  ['sq', 'スクワット'], ['バーベルスクワット', 'スクワット'],
  ['lpd', 'ラットプルダウン'], ['ラットプル', 'ラットプルダウン'],
  ['インクラインdb', 'インクラインダンベルプレス']
]);
const exerciseName = name => exerciseAliases.get(workoutKey(name)) || name;
const exerciseUnit = exercise => /プランク|壁座り|ウォールシット|dead\s*hang|plank/i.test(exerciseName(exercise)) ? '秒' : '回';
const workoutDateLabel = date => date.slice(0, 4) === today().slice(0, 4) ? fmt(date) : date;

function parseExercises(value) {
  const unique = new Map();
  for (const part of value.split(/[\n、，,／/]+/)) {
    const name = exerciseName(part.trim().replace(/^[・●⚫\-*]\s*/, ''));
    if (name && !unique.has(workoutKey(name))) unique.set(workoutKey(name), name);
  }
  return [...unique.values()];
}

function lastWorkoutExercise(name, date) {
  const matches = s.workout.sessions.filter(session =>
    session.date <= date && session.exercises.some(exercise => workoutKey(exerciseName(exercise.name)) === workoutKey(name))
  );
  const session = matches.sort((a, b) => b.date.localeCompare(a.date) || b.number - a.number)[0];
  return session?.exercises.find(exercise => workoutKey(exerciseName(exercise.name)) === workoutKey(name));
}

function suggestWorkout(name, short, date) {
  const mainLift = /スクワット|ベンチプレス|デッドリフト|レッグプレス|懸垂|チンニング|pull.?up|deadlift|squat|bench/i.test(name);
  const unit = exerciseUnit(name);
  return {
    name,
    unit,
    targetSets: short ? 1 : mainLift ? 3 : 2,
    targetReps: unit === '秒' ? '20〜30' : mainLift ? '6〜10' : '8〜12',
    last: lastWorkoutExercise(name, date)?.sets ?? [],
    sets: [],
    input: {weight: '', reps: ''}
  };
}

function workoutSetLabel(set, unit = '回') {
  return `${set.weight == null ? '' : `${set.weight} kg × `}${set.reps}${unit}`;
}

function workoutInputDraft() {

      draft.names !== draft.plannedNames || draft.date !== draft.plannedDate || draft.mode !== draft.plannedMode
    )) draft.stage = 'input';
  }
  save();
  return draft;
}

      return;
    }

      stage: 'plan', index: 0,
      plannedNames: draft.names, plannedDate: draft.date, plannedMode: draft.mode,
      exercises: names.map(name => suggestWorkout(name, draft.mode === 'short', draft.date))

    const reps = Number(repsInput);
    const status = document.getElementById('workout-status');
    if (weight !== null && (!/^\d+(?:\.\d+)?$/.test(weightInput) || !Number.isFinite(weight))) {

document.addEventListener('click', event => {
  const button = event.target.closest('[data-workout-action]');
  if (!button || button.disabled) return;
  const action = button.dataset.workoutAction;
  if (action === 'previous') {
    const input = document.getElementById('workout-names');
    input.value = s.workout.sessions.at(-1).exercises.map(exercise => exercise.name).join('、');
    input.dispatchEvent(new Event('input', {bubbles:true}));
    input.focus();
    return;
  }
  const draft = s.workout.draft;
  if (!draft) return;
  const exercise = draft.exercises[draft.index];
  if (action === 'repeat') {
    const last = exercise.sets.at(-1) ?? exercise.last.at(-1);
    if (last) workoutAddSet(exercise, last);
    return;
  }
  if (action === 'start' && draft.stage === 'plan') draft.stage = 'record';
  if (action === 'replan') draft.stage = 'plan';
  if (action === 'remove') exercise.sets.splice(Number(button.dataset.setIndex), 1);
  if (action === 'next') draft.index++;
  if (action === 'back') draft.index--;
  if (action === 'finish') {
    const exercises = draft.exercises.filter(entry => entry.sets.length).map(({name,unit,sets}) => ({name,unit,sets}));
    if (!exercises.length) return;
    const number = s.workout.sessions.length + 1;
    s.workout.sessions.push({number, date:draft.date, exercises});
    s.workout.draft = null;
    save();
    paint();
    scrollTo(0,0);
    notify(number % 5 === 0 ? `累計${number}回達成！ ✦` : `第${number}回、積み上げたよ ✦`);
    return;
  }
  save();
  paint();
  if (['start','next','back'].includes(action)) {
    document.getElementById('workout-exercise').focus();
    scrollTo(0,0);
  }
});

/* Import contract: a session {date:"YYYY-MM-DD", exercises:[{name,sets:[{weight,reps}]}]}
   or {sessions:[...]} or an array of sessions.  Confirm URL imports before mutation. */
function workoutNormalizeImport(raw){
 const arr=Array.isArray(raw)?raw:Array.isArray(raw?.sessions)?raw.sessions:[raw];
 if(arr.length<1||arr.length>100)throw Error('1〜100回分のセッションを指定してください');
 return arr.map((session)=>{
  if(!session||typeof session!=='object'||!/^20\d\d-\d\d-\d\d$/.test(session.date)||!Number.isFinite(dayDate(session.date).getTime())||iso(dayDate(session.date))!==session.date||session.date>today())throw Error('日付は今日以前のYYYY-MM-DD形式で指定してください');
  if(!Array.isArray(session.exercises)||!session.exercises.length||session.exercises.length>35)throw Error('種目は1〜35個で指定してください');
  const exercises=session.exercises.map(ex=>{
   if(typeof ex.name!=='string'||!ex.name.trim()||ex.name.length>80)throw Error('種目名が不正です');
   if(!Array.isArray(ex.sets)||!ex.sets.length||ex.sets.length>30)throw Error('各種目のセットは1〜30件にしてください');
   const unit=ex.unit==='秒'?'秒':'回';
   const sets=ex.sets.map(set=>{
    const weight=set.weight===null||set.weight===undefined||set.weight===''?null:Number(set.weight);
    const reps=Number(set.reps);
    if((weight!==null&&(!Number.isFinite(weight)||weight<0||weight>1000))||!Number.isInteger(reps)||reps<1||reps>10000)throw Error('重量か回数が不正です');
    return {weight,reps};
   });
   return {name:exerciseName(ex.name.trim()),unit,sets};
  });
  return {date:session.date,exercises};
 });
}
function workoutFingerprint(session){
 const canonical=(session.exercises||[]).map(ex=>[workoutKey(exerciseName(ex.name)),(ex.sets||[]).map(set=>[set.weight==null?null:Number(set.weight),Number(set.reps)])]);
 return JSON.stringify([session.date,canonical]);
}
function workoutImport(raw){
 const incoming=workoutNormalizeImport(raw),existing=new Set(s.workout.sessions.map(workoutFingerprint));
 let added=0;
 for(const session of incoming){
  const key=workoutFingerprint(session);
  if(existing.has(key))continue;
  existing.add(key);
  s.workout.sessions.push({...session,number:s.workout.sessions.length+1});
  added++;
 }
 if(added){save();paint();}
 notify(added?added+'回分のトレーニングを連携しました ✦':'すべて登録済み。重複はありません');
 return added;
}
function workoutLiftHistory(name){
 const history=[];
 for(const session of s.workout.sessions){
  const sets=(session.exercises||[]).filter(e=>workoutKey(exerciseName(e.name))===workoutKey(name)).flatMap(e=>e.sets||[]);
  const values=sets.map(set=>Number(set.weight)).filter(v=>Number.isFinite(v)&&v>0);
  if(values.length)history.push({date:session.date,weight:Math.max(...values)});
 }
 const days=new Map();
 for(const v of history)days.set(v.date,Math.max(v.weight,days.get(v.date)||0));
 return [...days].sort((a,b)=>a[0].localeCompare(b[0])).map(([date,weight])=>({date,weight}));
}
function workoutChart(history){
 if(!history.length)return '<p class="empty">記録を取り込むと、ここに重量の推移が表示されるよ。</p>';

 const coords=points.map((v,i)=>({x:points.length===1?160:32+i*256/(points.length-1),y:145-(v.weight-lo)/(hi-lo)*110}));

 coords.map((p,i)=>'<circle class="dot" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4"><title>'+esc(points[i].date)+' '+points[i].weight+'kg</title></circle>').join('')+

 return '<div class="card" id="vocal-quest" style="border:1px solid #8bbd84;background:linear-gradient(145deg,#16362e,#172338)">'+
 '<span class="eyebrow">🍏 SPECIAL QUEST · 12/5</span><h2>「ダーリン」で優勝を目指す！</h2>'+
 '<p class="tip">みゅうLIVEてんじん16 · 本番まで <b style="color:var(--lime);font-size:23px">'+remaining+'日</b>。目標は順位だけじゃなく、心を届ける歌を完成させること。</p>'+
 '<div class="qtrack"><div class="qfill" style="width:'+(total/24*100)+'%"></div></div>'+
 '<p class="small">スキル達成度 '+total+'/24 · 評価済み '+rated+'/8（0＝未評価、1＝練習中、2＝安定し始めた、3＝本番レベル）</p>'+
 vocalSkills.map(([id,label],i)=>'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0"><label for="vocal-'+id+'" style="font-size:13px;flex:1">'+(i+1)+'. '+esc(label)+'</label><select class="field" id="vocal-'+id+'" data-vocal-score="'+id+'" style="width:110px;padding:7px"><option value="0">未評価</option>'+[1,2,3].map(n=>'<option value="'+n+'" '+(Number(v.scores[id])===n?'selected':'')+'>'+n+' / 3</option>').join('')+'</select></div>').join('')+
 '<details style="margin:15px 0"><summary>📅 本番までの5段階ロードマップ</summary><div class="vision-prose">'+phases.map(([d,x])=>'<p><b>'+d+'</b>　'+x+'</p>').join('')+'</div></details>'+
 '<div style="border-top:1px solid #58736a;padding-top:13px;margin-top:12px"><h3>🎤 今日の練習ログ</h3>'+
 '<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="vocal-practiced" '+(log.practiced?'checked':'')+'> 今日、歌の練習をした</label>'+
 '<textarea class="field" id="vocal-notes" rows="3" maxlength="1000" placeholder="今日できたこと・改善点・次回の課題">'+esc(log.notes||'')+'</textarea>'+
 '<button type="button" class="button secondary" id="vocal-save">🍏 練習を記録する</button></div>'+
 '<p class="tip">記録はこの端末のLIFE OSに保存。評価はいつでも更新できるよ。</p></div>';
}
document.addEventListener('change',e=>{
 const b=e.target.closest('[data-vocal-score]');if(!b)return;
 const id=b.dataset.vocalScore;if(!vocalSkills.some(x=>x[0]===id))return;
 vocalState().scores[id]=Number(b.value);save();paint();notify('歌唱スキルの進捗を保存したよ 🍏');
});
document.addEventListener('click',e=>{
 if(!e.target.closest('#vocal-save'))return;
 const v=vocalState();v.logs[today()]={practiced:!!document.getElementById('vocal-practiced')?.checked,notes:(document.getElementById('vocal-notes')?.value||'').trim().slice(0,1000)};
 save();paint();notify('今日のボイトレを記録したよ 🎤');
});

paint();
workoutHashImport();
</script></body></html>
